<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
/* Kapak (görsel türü, açık ton): Canva üretken yapay zekâ kapatma ayarı. Izgarada görünen alan y 240–1680. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F5F4F0;font-family:Inter,sans-serif;color:#111114}
#bg{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 66%,#E3F2C4 0%,#F5F4F0 70%)}
#hd{position:absolute;left:30px;right:30px;top:330px;text-align:center}
#hd h1{font-family:"Inter Display";font-weight:800;font-size:90px;line-height:1.05;letter-spacing:-3px}
#hd .hl{display:inline-block;margin-top:14px;padding:4px 30px 14px;border-radius:26px;background:#FF2E93;color:#111114}
#phone{position:absolute;left:190px;top:720px;width:700px;height:1100px;border-radius:96px;background:#121214;padding:22px;transform:rotate(-4deg);
  box-shadow:0 50px 90px rgba(17,17,20,.30),0 0 0 2px #3a3a42}
#scr{position:relative;width:100%;height:100%;border-radius:76px;overflow:hidden;background:#F6F6F8;padding:150px 40px 0}
#isl{position:absolute;left:50%;top:26px;width:170px;height:48px;margin-left:-85px;border-radius:30px;background:#000}
#scr h3{font-family:"Inter Display";font-size:64px;font-weight:800;margin:0 8px 10px}
#scr .sub{font-size:32px;font-weight:700;color:#7B7B85;margin:30px 10px 16px;letter-spacing:.5px}
.card{background:#fff;border-radius:34px;padding:10px 32px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px 0;font-size:38px;font-weight:700;line-height:1.15}
.tg{flex:none;position:relative;width:132px;height:76px;border-radius:40px;background:#D9D9DE}
.tg i{position:absolute;top:6px;left:6px;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.chip{margin-top:34px;display:flex;align-items:center;gap:18px;padding:24px 28px;border-radius:30px;background:#fff;border:4px solid #C6F24E;font-size:36px;font-weight:800}
.chip .ok{flex:none;width:54px;height:54px;border-radius:50%;background:#C6F24E;display:flex;align-items:center;justify-content:center}
#kare{position:absolute;left:700px;top:1260px;width:380px;height:380px;filter:drop-shadow(0 26px 36px rgba(17,17,20,.28))}
</style></head><body><div id="bg"></div>
<div id="hd"><h1>Canva'da yapay zekâyı<br><span class="hl">kapat.</span></h1></div>
<div id="phone"><div id="scr"><div id="isl"></div>
 <h3>Ayarlar</h3><div class="sub">İZİNLER</div>
 <div class="card"><div class="rw"><div>Üretken yapay zekâ özellikleri</div><div class="tg"><i></i></div></div></div>
 <div class="chip"><div class="ok"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Arka planı kaldır</div>
</div></div>
<div id="kare"><svg width="380" height="380" viewBox="0 0 200 200"><line x1="100" y1="58" x2="100" y2="40" stroke="#B8F24A" stroke-width="6" stroke-linecap="round"></line><circle cx="100" cy="35" r="8" fill="#7B61FF"></circle><rect x="48" y="56" width="104" height="88" rx="24" fill="#B8F24A"></rect><rect x="60" y="68" width="80" height="56" rx="13" fill="#111114"></rect><path d="M68 82 V76 H74 M126 76 H132 V82 M132 110 V116 H126 M74 116 H68 V110" fill="none" stroke="#B8F24A" stroke-width="3" stroke-linecap="round"></path><rect x="83" y="84" width="9" height="16" rx="4.5" fill="#FFFFFF"></rect><path d="M106 93 Q112.5 87 119 93" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path><path d="M90 106 Q100 115 110 106" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path><rect x="84" y="144" width="32" height="10" rx="5" fill="#B8F24A"></rect><rect x="68" y="154" width="64" height="8" rx="4" fill="#F5F4F0"></rect></svg></div>
</body></html>
