const ACC={'Ç':['C','ced'],'Ğ':['G','breve'],'İ':['I','dot'],'Ö':['O','uml'],'Ş':['S','ced'],'Ü':['U','uml']};
function glyph(ch,x,y,sz,col){
  let base=ch, acc=null; if(ACC[ch]){base=ACC[ch][0];acc=ACC[ch][1];}

  for(let r=0;r<7;r++)for(let c=0;c<5;c++) if(g[r]&(16>>c)) X.fillRect(x+c*sz,y+r*sz,sz,sz);
  if(acc==='dot') X.fillRect(x+2*sz,y-2*sz,sz,sz);
  if(acc==='uml'){X.fillRect(x+1*sz,y-2*sz,sz,sz);X.fillRect(x+3*sz,y-2*sz,sz,sz);}
  if(acc==='breve'){X.fillRect(x+1*sz,y-3*sz,sz,sz);X.fillRect(x+3*sz,y-3*sz,sz,sz);X.fillRect(x+2*sz,y-2*sz,sz,sz);}
  if(acc==='ced'){X.fillRect(x+2*sz,y+7*sz,sz,sz);X.fillRect(x+1*sz,y+8*sz,sz,sz);}
}
function txt(s,x,y,sz=1,col=WHITE,align='left',shadow=INK){
  s=s.toLocaleUpperCase('tr-TR'); const w=s.length*6*sz-sz; let x0=align==='center'?Math.round(x-w/2):align==='right'?x-w:x;

  for(let i=0;i<s.length;i++) glyph(s[i],x0+i*6*sz,y,sz,col);

}

 [0.0,['KARE TEK BAŞINA','İZLİYOR:','1 İZLENME.'],2],

  let cur=DLG[0]; DLG.forEach(d=>{if(t>=d[0]) cur=d;});
  const shown=Math.min(cur[1].length, 1+Math.floor((t-cur[0])/0.45));
  for(let i=0;i<shown;i++) txt(cur[1][i],16,386+i*22,2,i===cur[2]?PINK:INK,'left',null);
  // geçiş perdeleri
  [5.0,8.0,11.0,17.0,22.5].forEach(a=>wipe(t,a));
  OUT.imageSmoothingEnabled=false; OUT.drawImage(S,0,0,270,480,0,0,1080,1920);
};
