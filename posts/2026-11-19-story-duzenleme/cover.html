<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
/* Kapak (Kare türü, açık ton): Story düzenleme. Izgarada görünen alan y 240–1680. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F5F4F0;font-family:Inter,sans-serif;color:#111114}
#bg{position:absolute;inset:0;background:radial-gradient(60% 40% at 55% 62%,#E3F2C4 0%,#F5F4F0 70%)}
#hd{position:absolute;left:70px;right:70px;top:320px;text-align:center}
#hd h1{font-family:"Inter Display";font-weight:800;font-size:112px;line-height:1.05;letter-spacing:-3px}
#hd .hl{display:inline-block;margin-top:18px;padding:6px 30px 14px;border-radius:26px;background:#FF2E93;color:#111114}
#phone{position:absolute;left:540px;top:700px;width:430px;height:880px;border-radius:70px;background:#121214;padding:15px;transform:rotate(7deg);
  box-shadow:0 50px 90px rgba(17,17,20,.35),0 0 0 2px #3a3a42}
#scr{position:relative;width:100%;height:100%;border-radius:57px;overflow:hidden;background:linear-gradient(165deg,#2c3140 0%,#161922 55%,#0d0f15 100%);color:#fff;text-align:center}
#isl{position:absolute;left:50%;top:18px;width:120px;height:34px;margin-left:-60px;border-radius:24px;background:#000}
#tools{position:absolute;left:20px;right:20px;top:70px;display:flex;gap:10px;align-items:center}
.tl{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.tl.on{background:#C6F24E;color:#0B0B0D;border-color:#C6F24E}
#done{margin-left:auto;padding:11px 20px;border-radius:30px;background:#fff;color:#111;font-weight:800;font-size:22px}
.tg{display:inline-block;margin-top:290px;padding:8px 20px;border-radius:12px;background:#FF2E93;font-weight:800;font-size:27px}
.l1{margin-top:20px;font-family:"Inter Display";font-weight:800;font-size:46px}
.tm{margin-top:6px;font-family:"Inter Display";font-weight:800;font-size:96px;color:#C6F24E;letter-spacing:-2px}
.tm i{display:inline-block;width:6px;height:78px;background:#fff;margin-left:6px;vertical-align:-4px}
#kare{position:absolute;left:-40px;top:790px;width:780px;height:780px;filter:drop-shadow(0 30px 40px rgba(17,17,20,.28))}
</style></head><body><div id="bg"></div>
<div id="hd"><h1>Story'de hata mı?<br><span class="hl">Silme, düzenle.</span></h1></div>
<div id="phone"><div id="scr"><div id="isl"></div>
 <div id="tools"><div class="tl on">Aa</div><div class="tl"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/></svg></div><div class="tl"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></div><div id="done">Bitti</div></div>
 <div class="tg">CANLI YAYIN</div><div class="l1">Bu akşam saat</div><div class="tm">21.00<i></i></div>
</div></div>
